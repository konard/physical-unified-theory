name: Requirements Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  requirements:
    name: Require verified delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the requirements checker
        run: python3 -m unittest discover -s experiments -p test_requirements.py -v
      - name: Fetch registered GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp --method GET "repos/$GITHUB_REPOSITORY/issues" \
            -f state=all -f per_page=100 > "$RUNNER_TEMP/requirements-issues.json"
      - name: Check requirements and delivery evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous=()
          if git cat-file -e "$BASE_SHA:docs/REQUIREMENTS.md" 2>/dev/null; then
            git show "$BASE_SHA:docs/REQUIREMENTS.md" > "$RUNNER_TEMP/previous-requirements.md"
            previous=(--previous-register "$RUNNER_TEMP/previous-requirements.md")
          fi
          python3 scripts/check_requirements.py "$RUNNER_TEMP/requirements-issues.json" "${previous[@]}"
