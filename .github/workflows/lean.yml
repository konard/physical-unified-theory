name: Lean Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'lean/**'
      - 'experiments/null_cone.py'
      - '.github/workflows/lean.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lean/**'
      - 'experiments/null_cone.py'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan (Lean version manager)
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Cache Lean toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
        key: ${{ runner.os }}-lean-elan-v2-${{ hashFiles('lean/lean-toolchain') }}
        restore-keys: |
          ${{ runner.os }}-lean-elan-v2-

    - name: Verify Lean installation
      working-directory: lean
      run: |
        lean --version
        lake --version

    - name: Fetch cached Mathlib dependencies
      working-directory: lean
      shell: bash
      run: |
        mapfile -t modules < <(rg --no-filename '^(public )?import Mathlib\.' --glob '*.lean' | awk '{print $NF}' | sort -u)
        lake exe cache get "${modules[@]}"

    - name: Build Lean project
      working-directory: lean
      shell: bash
      run: lake build 2>&1 | tee lean-build.log

    - name: Run Lean tests
      working-directory: lean
      shell: bash
      run: |
        lake env lean tests/Units.lean 2>&1 | tee lean-test.log
        lake env lean tests/DensityMatrix.lean 2>&1 | tee -a lean-test.log
        lake env lean tests/PositionMeasurement.lean 2>&1 | tee -a lean-test.log
        lake env lean tests/NullCone.lean 2>&1 | tee -a lean-test.log

    - name: Run null cone numerical checks
      run: python3 experiments/null_cone.py -v

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lean-logs
        path: |
          lean/lean-build.log
          lean/lean-test.log
          lean/.lake/build/log
        retention-days: 7
